[global]
fsid = 94ccae01-cc84-4fc0-96fd-032579767ef6
mon_initial_members = ceph-mon1
mon_host = ceph-mon1

osd failsafe full ratio = 0.99
mon osd full ratio = 0.99
mon osd nearfull ratio = 0.99
mon osd backfillfull ratio = 0.99
mon_max_pg_per_osd = 200
filestore fd cache size = 32
# enable experimental unrecoverable data corrupting features = *
osd_crush_chooseleaf_type = 0

auth cluster required = cephx
auth service required = cephx
auth client required = cephx
osd journal size = 1024
osd pool default size = 3  # Write an object n times.
osd pool default min size = 1 # Allow writing n copies in a degraded state.
osd_max_object_name_len = 1024
ms bind msgr2 = true
ms bind msgr1 = true
# Level 20 logging for every subsystem writes gigabytes per hour to the OSD
# containers' disks under load. Turn it on per subsystem when debugging.
# debug = 20

[client]
    # Fail a rados op (including NDP calls) after 2 minutes instead of
    # blocking the calling Faasm thread forever if an OSD is stuck
    rados_osd_op_timeout = 120

[mgr]
    #   mgr disabled modules = rook
    mgr/telemetry/nag = false
    mgr/telemetry/enable = true
[mon]
    # mon_data_avail_warn = 2
    mon_data_avail_crit = 1
    auth allow insecure global id reclaim = false
    mon_osd_reporter_subtree_level = osd
    mon_allow_pool_delete = true
    mon_allow_pool_size_one = true

[osd]
    # 0 = errors only; 5 logs every NDP message from the faasm object class
    debug_objclass = 1
    # The faasm object class holds an op thread (and its PG lock) while the
    # offloaded funclet runs, waiting up to 30 s between messages. With the
    # defaults (15 s / 150 s) the OSD stops answering heartbeats, gets marked
    # down and can abort itself.
    osd_op_thread_timeout = 60
    osd_op_thread_suicide_timeout = 600
    osd_check_max_object_name_len_on_startup = false
    osd_max_object_size = 134217728  # 128MB (default is 128MB, max allowed 4GB)
    osd_pool_default_pg_num = 128
    osd_pool_default_pgp_num = 128
    osd class load list = *
    osd class default list = *
    osd fast shutdown = false
    osd objectstore = filestore
    filestore wbthrottle xfs ios start flusher = 10
    filestore wbthrottle xfs ios hard limit = 20
    filestore wbthrottle xfs inodes hard limit = 30
    filestore wbthrottle btrfs ios start flusher = 10
    filestore wbthrottle btrfs ios hard limit = 20
    filestore wbthrottle btrfs inodes hard limit = 30
    filestore btrfs snap = false
    bluestore fsck on mount = false
    bluestore block create = true
    # bluestore block db path = $CEPH_DEV_DIR/osd\$id/block.db.file
    bluestore block db size = 1073741824
    bluestore block db create = true
    # bluestore block wal path = $CEPH_DEV_DIR/osd\$id/block.wal.file
    bluestore block wal size = 1048576000
    bluestore block wal create = true
